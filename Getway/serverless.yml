# Archivo de configuración Serverless Framework para el servicio "gateway"
 # Cada sección tiene un comentario breve explicando su propósito.

 # Nombre del servicio gestionado por Serverless
service: gateway
frameworkVersion: "4" # Versión del framework serverless

# Configuración del proveedor (AWS) y parámetros globales
provider:
  name: aws
  runtime: nodejs22.x
  stage: ${opt:stage, 'develop'} # Stage por defecto (se puede pasar con --stage)
  region: us-east-1

  # Variables de entorno que estarán disponibles en las funciones Lambda
  environment:
    STAGE: ${self:provider.stage}
    JWT_SECRET: ${ssm:/taller/${self:provider.stage}/JWT-SECRET} # secreto desde SSM
    CORS_ORIGIN: ${file(./config/config-${self:provider.stage}.json):CORS_ORIGIN} # lectura desde archivo de configuración

  # Configuración específica del API Gateway (usage plan, api keys)
  apiGateway:
    usagePlan:
      - freeTier:
          quota:
            limit: 10000
            period: MONTH
          throttle:
            rateLimit: 10
            burstLimit: 20
    apiKeys:
      - freeTier:
          - ${self:provider.stage}-AmazonLite-DefaultKey

  # Declaración de permisos IAM que tendrán las Lambdas (logs, etc.)
  iamRoleStatements:
    - Effect: Allow
      Action:
        - logs:CreateLogGroup
        - logs:CreateLogStream
        - logs:PutLogEvents
      Resource: "*"


# Definición de funciones Lambda del servicio
functions:
  # Función 'ping' usada para comprobar que el servicio responde
  ping:
    handler: src/handlers/ping.handler
    name: ${self:provider.stage}-gateway-ping
    events:
      - http:
          method: get
          path: /gateway/ping
          cors:
            origin: "*"
            headers:
              - Content-Type
              - Authorization
              - X-Api-Key
              - X-Amz-Date
              - X-Amz-Security-Token

  # Función autorizadora (si existe) para validar tokens/credenciales
  authorizer:
    handler: src/handlers/auth.authorizer
    name: ${self:provider.stage}-auth


# Recursos CloudFormation adicionales (API Gateway custom resources, permisos)
resources:
  Resources:
    # Authorizer custom para API Gateway (si se usa una Lambda como authorizer)
    MainAuthorizer:
      Type: AWS::ApiGateway::Authorizer
      Properties:
        Name: taller-${self:provider.stage}-jwt-authorizer
        RestApiId:
          Ref: ApiGatewayRestApi
        Type: TOKEN
        IdentitySource: method.request.header.Authorization
        AuthorizerUri:
          Fn::Sub: >-
            arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerLambdaFunction.Arn}/invocations
        AuthorizerResultTtlInSeconds: 300

    # Permisos para que API Gateway pueda invocar la Lambda authorizer
    AuthorizerInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName:
          Fn::GetAtt: [AuthorizerLambdaFunction, Arn]
        Action: lambda:InvokeFunction
        Principal: apigateway.amazonaws.com
        SourceArn:
          Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayRestApi}/*

    # Respuestas personalizadas de API Gateway para CORS y errores comunes
    GatewayResponseUnauthorized:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseType: UNAUTHORIZED
        StatusCode: 401
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"

    GatewayResponseAccessDenied:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseType: ACCESS_DENIED
        StatusCode: 403
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"

    GatewayResponseDefault4xx:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseType: DEFAULT_4XX
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"

    GatewayResponseDefault5xx:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId:
          Ref: ApiGatewayRestApi
        ResponseType: DEFAULT_5XX
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"

  # Salidas útiles que pueden exportarse a otros stacks
  Outputs:
    MainRestApiId:
      Value:
        Ref: ApiGatewayRestApi
      Export:
        Name: MainRestApiId
    MainRestApiRootResourceId:
      Value:
        Fn::GetAtt: [ApiGatewayRestApi, RootResourceId]
      Export:
        Name: MainRestApiRootResourceId
    MainAuthorizerId:
      Value:
        Ref: MainAuthorizer
      Export:
        Name: MainAuthorizerId
